# Shared security headers.
#
# nginx does not inherit add_header into a location that declares its own, so
# this snippet is included in every block that sets headers.
#
# CSP note: Next.js static export emits inline hydration scripts and
# framer-motion writes inline style attributes, so 'unsafe-inline' is required
# for both script-src and style-src. Nonces are not possible without a server
# to generate them per request. object-src, base-uri, and frame-ancestors are
# locked down to limit what that allowance can be abused for.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://formspree.io https://challenges.cloudflare.com https://formrelay.dasdev.net https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Deliberately no X-Robots-Tag here: indexing is driven by page metadata and
# robots.txt. Asserting "index" at the server would also apply to 404 responses.
