name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via webhook
        run: |
          curl -X POST https://webhook.dasdev.net/deploy \
            -H "X-Deploy-Token: das-web-autodeploy-2026" \
            -H "Content-Length: 0" \
            --max-time 30
