# The export writes work.html and serves it at /work via try_files, so both URLs
# would otherwise return 200 for identical content. Two live URLs per page is
# duplicate content, and the .html one also breaks hydration: the client reads
# location.pathname as "/work.html", disagrees with the prerender about which
# nav link is active, and React throws away the server HTML to re-render.
#
# Keyed on $request_uri rather than $uri because $request_uri is what the client
# actually asked for. Matching $uri would also catch the internal rewrites that
# index and try_files perform, turning "/" into a redirect loop through
# /index.html.
map $request_uri $canonical_path {
    default                                 "";
    "~^/index\.html(?:[?#].*)?$"            "/";
    "~^(?<stem>/[^?#]*)/index\.html(?:[?#].*)?$"  "$stem/";
    "~^(?<page>/[^?#]*)\.html(?:[?#].*)?$"  "$page";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS in front of this container and sets the real client
    # IP; nginx only ever speaks plain HTTP on the internal proxy network.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml text/xml;

    # Send a .html request to its canonical clean URL. Safe as a server-level
    # "if" with only a return, and it cannot fire on internal rewrites.
    if ($canonical_path) {
        return 301 $canonical_path$is_args$args;
    }

    # Authenticated surfaces: never cached, never indexed.
    location /dashboard {
        include /etc/nginx/snippets/private-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }

    location /admin {
        include /etc/nginx/snippets/private-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }

    # Content-hashed build output is safe to cache forever.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # HTML revalidates so a deploy is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Real 404s instead of serving the home page shell, which would otherwise
    # report 200 for every unknown URL and create soft-404s in search results.
    error_page 404 /404.html;

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Dotfiles are never part of the export; block them explicitly.
    location ~ /\. {
        deny all;
    }
}
